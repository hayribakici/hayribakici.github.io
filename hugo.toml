baseURL = "https://hayribakici.github.io/"
defaultContentLanguage = "en"
locale = "en-US"
title = "Hello"
theme = "dream"

[pagination]
  pagerSize = 12

[params]
  author = "Onur Hayri Bakici"
  showAuthor = false
  headerTitle = "hello"
  description = "Projects and learning materials by Onur Hayri Bakici."
  lightTheme = "emerald"
  darkTheme = "forest"
  noDefaultSummaryCover = true
  reorderNavItems = ["github"]
  [params.navItems.github]
    title = "GitHub"
    href = "https://github.com/hayribakici"
    target = "_blank"
    icon = "logo-github"

  [params.advanced]
    customCSS = ["css/projects.css"]
